<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zebra Digital Card</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --zebra:  #1a1a1a;
  --accent: #e31837;
  --text:   #0f0f0f;
  --muted:  #6b7280;
  --font:   Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
}

html { height: 100%; }

body {
  font-family: var(--font);
  background: #08080e;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 16px 80px;
  position: relative;
  overflow-x: hidden;
}

#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  display: block;
}

.scene {
  width: 100%;
  max-width: 400px;
  perspective: 1000px;
  position: relative;
  z-index: 10;
  margin-top: 20px;
}

.card {
  width: 100%;
  background: rgba(255,255,255,0.76);
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.6);
  box-shadow: 0 24px 64px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.2);
  overflow: hidden;
  opacity: 0;
  transform: translateY(40px);
  animation: cardRise 0.7s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
  transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
  will-change: transform;
}

@keyframes cardRise { to { opacity:1; transform:translateY(0); } }

.card::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 55%);
  pointer-events: none; z-index: 1; border-radius: 22px;
}

/* HEADER */
.card-header {
  background: rgba(255,255,255,0.7);
  padding: 13px 18px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  position: relative; z-index: 2;
}
.zebra-logo-img { height: 25px; display: block; }
.zebra-logo-fallback {
  font-family: var(--font); font-size: 18px; font-weight: 700;
  letter-spacing: 4px; color: var(--zebra); display: none;
}
.nfc-badge {
  display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.09);
  border-radius: 20px; padding: 4px 10px;
  font-size: 9px; letter-spacing: 2px; color: #555;
  font-weight: 700; text-transform: uppercase; font-family: var(--font);
}
.nfc-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 5px var(--accent); animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

/* HERO */
.card-hero {
  position: relative; height: 90px;
  background: linear-gradient(130deg, #111 0%, #222 45%, #c0102a 100%);
  overflow: hidden; z-index: 2;
}
.card-hero-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 24px 24px;
}
.card-hero-glow {
  position: absolute; width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(227,24,55,0.55) 0%, transparent 65%);
  right: -30px; top: -80px;
  animation: gPulse 3.5s ease-in-out infinite alternate;
}
@keyframes gPulse { from{transform:scale(1);opacity:.7} to{transform:scale(1.25);opacity:1} }
.card-hero-label {
  position: absolute; bottom: 12px; left: 18px;
  font-size: 8px; letter-spacing: 3px;
  color: rgba(255,255,255,0.3); text-transform: uppercase; font-family: var(--font);
}

/* AVATAR */
.avatar-section { display: flex; justify-content: center; position: relative; z-index: 3; }
.avatar-wrap { margin-top: -48px; display: flex; flex-direction: column; align-items: center; }
.avatar {
  width: 90px; height: 90px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.95);
  background: linear-gradient(135deg,#333,#111);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font); font-size: 28px; font-weight: 700; color: white;
  box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  overflow: hidden; cursor: pointer; position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
}
.avatar:hover { transform:scale(1.05); box-shadow:0 10px 36px rgba(0,0,0,0.4),0 0 0 3px rgba(227,24,55,0.35); }
.avatar-img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
.avatar-overlay {
  position: absolute; inset: 0; border-radius: 50%;
  background: rgba(0,0,0,0.52);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; opacity: 0; transition: opacity 0.2s;
}
.avatar:hover .avatar-overlay { opacity: 1; }
.avatar-hint { font-size: 9px; color: var(--muted); margin-top: 5px; letter-spacing: 1.5px; text-transform: uppercase; font-family: var(--font); }
#avatarInput { display: none; }

/* BODY */
.card-body { padding: 18px 20px 24px; position: relative; z-index: 2; }

.name {
  font-family: var(--font); font-size: 26px; font-weight: 700;
  text-align: center; color: var(--zebra); letter-spacing: 0.5px; line-height: 1.1; margin-top: 4px;
}
.title-line {
  text-align: center; margin-top: 5px; font-size: 10px; font-weight: 700;
  color: var(--accent); letter-spacing: 3px; text-transform: uppercase; font-family: var(--font);
}
.company-line { text-align: center; margin-top: 3px; font-size: 12px; color: var(--muted); }

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.08), transparent);
  margin: 16px 0;
}

.section { margin-top: 16px; }
.section-label {
  font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 9px; padding-left: 2px; font-family: var(--font);
}

/* LINKS — stagger animate */
.links { display: flex; flex-direction: column; gap: 7px; }

.link-btn {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.6);
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 12px;
  text-decoration: none; color: var(--text);
  transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-20px);
  animation: slideIn 0.45s cubic-bezier(0.22,1,0.36,1) forwards;
}
.link-btn:nth-child(1) { animation-delay: 0.55s; }
.link-btn:nth-child(2) { animation-delay: 0.68s; }
.link-btn:nth-child(3) { animation-delay: 0.81s; }
.link-btn:nth-child(4) { animation-delay: 0.94s; }

@keyframes slideIn { to { opacity:1; transform:translateX(0); } }

.link-btn:hover {
  background: rgba(255,255,255,0.95);
  border-color: rgba(227,24,55,0.2);
  box-shadow: 0 4px 14px rgba(0,0,0,0.1), 4px 0 0 var(--accent) inset;
  transform: translateX(4px);
}
.link-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.link-label { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; font-family: var(--font); }
.link-value { font-size: 13px; font-weight: 600; margin-top: 1px; }
.link-text { text-align: left; line-height: 1.4; flex: 1; }
.link-arrow { color: #bbb; font-size: 20px; margin-left: auto; }

/* TAX BOX */
.tax-box {
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 13px; overflow: hidden;
  opacity: 0;
  animation: fadeUp 0.5s ease 1.05s forwards;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

.tax-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 9px 13px; border-bottom: 1px solid rgba(0,0,0,0.05);
  transition: background 0.15s;
}
.tax-row:last-child { border-bottom: none; }
.tax-row:hover { background: rgba(255,255,255,0.65); }
.tax-key {
  font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px;
  text-transform: uppercase; white-space: nowrap; padding-top: 2px;
  font-family: var(--font); flex-shrink: 0; min-width: 88px;
}
.tax-val-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; flex: 1; }
.tax-val { font-size: 12px; font-weight: 600; color: var(--text); text-align: right; }
.tax-id-val { font-family: var(--font); font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--zebra); }
.copy-btn {
  background: none; border: 1px solid rgba(0,0,0,0.12); border-radius: 5px; padding: 2px 8px;
  font-size: 9px; color: var(--muted); cursor: pointer; font-family: var(--font);
  font-weight: 700; transition: all 0.15s; flex-shrink: 0;
}
.copy-btn:hover { background: var(--zebra); color: white; border-color: var(--zebra); }

/* BUTTONS */
.btn-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px;
  opacity: 0; animation: fadeUp 0.5s ease 1.18s forwards;
}
.btn-half {
  padding: 13px 8px; border: none; border-radius: 12px;
  font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.btn-save {
  background: linear-gradient(135deg,#1a1a1a,#383838); color: white;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}
.btn-save:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,0.4); }
.btn-qr {
  background: linear-gradient(135deg,#e31837,#ff4d30); color: white;
  box-shadow: 0 4px 14px rgba(227,24,55,0.4);
}
.btn-qr:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(227,24,55,0.5); }

/* FOOTER */
.card-footer {
  text-align: center; padding: 10px 20px 14px;
  font-size: 9px; letter-spacing: 2px; color: rgba(0,0,0,0.22);
  text-transform: uppercase; font-family: var(--font);
  border-top: 1px solid rgba(0,0,0,0.05); position: relative; z-index: 2;
}

/* QR MODAL */
.qr-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.qr-backdrop.open { opacity: 1; pointer-events: all; }
.qr-modal {
  background: rgba(255,255,255,0.94); backdrop-filter: blur(20px);
  border-radius: 20px; padding: 26px 22px; max-width: 290px; width: 90%; text-align: center;
  transform: scale(0.94) translateY(16px);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  box-shadow: 0 32px 80px rgba(0,0,0,0.3);
}
.qr-backdrop.open .qr-modal { transform: scale(1) translateY(0); }
.qr-modal-title { font-family: var(--font); font-size: 18px; font-weight: 700; letter-spacing: 1px; color: var(--zebra); }
.qr-modal-sub { font-size: 11px; color: var(--muted); margin-top: 4px; margin-bottom: 14px; }
#qrContainer { display: flex; justify-content: center; }
#qrContainer img, #qrContainer canvas { border-radius: 8px; }
.qr-url { font-size: 9px; color: var(--muted); margin-top: 10px; word-break: break-all; font-family: var(--font); }
.qr-close {
  margin-top: 14px; background: var(--zebra); color: white;
  border: none; border-radius: 10px; padding: 9px 26px; cursor: pointer;
  font-family: var(--font); font-size: 11px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; transition: opacity 0.15s;
}
.qr-close:hover { opacity: 0.8; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; z-index: 9999;
  transform: translateX(-50%) translateY(70px);
  background: rgba(20,20,20,0.92); backdrop-filter: blur(12px);
  color: white; padding: 10px 22px; border-radius: 28px;
  font-size: 12px; font-weight: 600;
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  font-family: var(--font); white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.1);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="scene" id="scene">
  <div class="card" id="card"></div>
</div>

<div class="toast" id="toast"></div>

<div class="qr-backdrop" id="qrBackdrop" onclick="closeQR(event)">
  <div class="qr-modal">
    <div class="qr-modal-title">📲 Chia sẻ card</div>
    <div class="qr-modal-sub">Quét để mở profile hoặc lưu danh bạ</div>
    <div id="qrContainer"></div>
    <div class="qr-url" id="qrUrl"></div>
    <button class="qr-close" onclick="document.getElementById('qrBackdrop').classList.remove('open')">Đóng</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>

// ================================================================
// 3D COSMIC GALAXY, BLACK HOLE & PLANETS
// ================================================================
(function () {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setClearColor(0x05050b, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05050b, 0.012);

  const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 250);
  camera.position.z = 25;

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // Lights
  scene.add(new THREE.AmbientLight(0x202035, 0.7));
  const coreLight = new THREE.PointLight(0xff3355, 6, 60);
  coreLight.position.set(7.5, 6.5, -7);
  scene.add(coreLight);

  const blueLight = new THREE.PointLight(0x2266ff, 4, 55);
  blueLight.position.set(-10, -5, 4);
  scene.add(blueLight);

  const sunLight = new THREE.DirectionalLight(0xffeedd, 1.2);
  sunLight.position.set(6, 14, 10);
  scene.add(sunLight);

  // --------------------------------------------------------------
  // 1. SPIRAL GALAXY (Thiên hà xoắn ốc)
  // --------------------------------------------------------------
  const galaxyGroup = new THREE.Group();
  scene.add(galaxyGroup);

  const starCount = 3600;
  const starPos = new Float32Array(starCount * 3);
  const starColors = new Float32Array(starCount * 3);

  const branches = 3;
  const galaxyRadius = 34;
  const spin = 1.3;

  const colorInside = new THREE.Color(0xff3355);  // Zebra red cosmic glow
  const colorMid    = new THREE.Color(0x7b2cbf);  // Deep Nebula Purple
  const colorOutside= new THREE.Color(0x2277ff);  // Cosmic Blue

  for (let i = 0; i < starCount; i++) {
    const r = Math.pow(Math.random(), 2.2) * galaxyRadius + 0.8;
    const branchAngle = ((i % branches) * 2 * Math.PI) / branches;
    const spinAngle = r * spin * 0.12;

    const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.42) * r;
    const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.32) * r;
    const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.42) * r;

    starPos[i * 3]     = Math.cos(branchAngle + spinAngle) * r + randomX;
    starPos[i * 3 + 1] = randomY;
    starPos[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

    const mixedColor = colorInside.clone();
    const ratio = r / galaxyRadius;
    if (ratio < 0.38) {
      mixedColor.lerp(colorMid, ratio / 0.38);
    } else {
      mixedColor.copy(colorMid).lerp(colorOutside, (ratio - 0.38) / 0.62);
    }

    starColors[i * 3]     = mixedColor.r;
    starColors[i * 3 + 1] = mixedColor.g;
    starColors[i * 3 + 2] = mixedColor.b;
  }

  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
  const starMat = new THREE.PointsMaterial({
    size: 0.22,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending
  });
  const galaxyPoints = new THREE.Points(starGeo, starMat);
  galaxyGroup.add(galaxyPoints);
  galaxyGroup.rotation.x = Math.PI / 4.8;
  galaxyGroup.position.set(0, -2, -6);

  // --------------------------------------------------------------
  // 2. BLACK HOLE (Lỗ đen vũ trụ & Đĩa bồi tụ)
  // --------------------------------------------------------------
  const blackHoleGroup = new THREE.Group();
  blackHoleGroup.position.set(7.5, 6.5, -9);
  scene.add(blackHoleGroup);

  const bhSphere = new THREE.Mesh(
    new THREE.SphereGeometry(2.1, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  blackHoleGroup.add(bhSphere);

  const accretionRing1 = new THREE.Mesh(
    new THREE.RingGeometry(2.25, 3.8, 64),
    new THREE.MeshBasicMaterial({
      color: 0xff3355,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    })
  );
  accretionRing1.rotation.x = Math.PI / 2.3;
  accretionRing1.rotation.y = Math.PI / 7;
  blackHoleGroup.add(accretionRing1);

  const accretionRing2 = new THREE.Mesh(
    new THREE.RingGeometry(3.7, 6.0, 64),
    new THREE.MeshBasicMaterial({
      color: 0xff7700,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending
    })
  );
  accretionRing2.rotation.x = Math.PI / 2.3;
  accretionRing2.rotation.y = Math.PI / 7;
  blackHoleGroup.add(accretionRing2);

  const bhParticleCount = 380;
  const bhPos = new Float32Array(bhParticleCount * 3);
  const bhCol = new Float32Array(bhParticleCount * 3);
  const bhOrbits = [];
  for (let i = 0; i < bhParticleCount; i++) {
    const orbitR = 2.3 + Math.random() * 3.4;
    const angle = Math.random() * Math.PI * 2;
    const speed = (0.025 + Math.random() * 0.02) * (3.0 / orbitR);
    bhOrbits.push({ r: orbitR, angle, speed, yOffset: (Math.random() - 0.5) * 0.25 });
    const c = Math.random();
    bhCol[i * 3]     = 1.0;
    bhCol[i * 3 + 1] = c > 0.6 ? 0.8 : 0.2;
    bhCol[i * 3 + 2] = c > 0.85 ? 0.9 : 0.05;
  }
  const bhPGeo = new THREE.BufferGeometry();
  bhPGeo.setAttribute('position', new THREE.BufferAttribute(bhPos, 3));
  bhPGeo.setAttribute('color', new THREE.BufferAttribute(bhCol, 3));
  const bhPoints = new THREE.Points(bhPGeo, new THREE.PointsMaterial({
    size: 0.18,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending
  }));
  blackHoleGroup.add(bhPoints);

  // --------------------------------------------------------------
  // 3. PLANETS & MOONS (Hành tinh & Vệ tinh)
  // --------------------------------------------------------------
  const planets = [];

  function createPlanet(config) {
    const pGroup = new THREE.Group();
    pGroup.position.set(config.x, config.y, config.z);

    const bodyMat = new THREE.MeshStandardMaterial({
      color: config.color,
      metalness: config.metalness || 0.4,
      roughness: config.roughness || 0.4,
      emissive: config.emissive || 0x000000,
      emissiveIntensity: 0.25
    });
    const body = new THREE.Mesh(new THREE.SphereGeometry(config.radius, 32, 32), bodyMat);
    pGroup.add(body);

    if (config.hasRing) {
      const ringGeo = new THREE.RingGeometry(config.ringInner, config.ringOuter, 64);
      const ringMat = new THREE.MeshStandardMaterial({
        color: config.ringColor || config.color,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: config.ringOpacity || 0.75,
        roughness: 0.5
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = config.ringRotX || (Math.PI / 2.4);
      pGroup.add(ringMesh);
    }

    let moonMesh = null;
    let moonOrbit = null;
    if (config.hasMoon) {
      const moonGeo = new THREE.SphereGeometry(config.moonRadius || 0.25, 16, 16);
      const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7 });
      moonMesh = new THREE.Mesh(moonGeo, moonMat);
      pGroup.add(moonMesh);
      moonOrbit = { dist: config.moonDist || 2.4, angle: 0, speed: 0.03 };
    }

    scene.add(pGroup);

    planets.push({
      group: pGroup,
      body,
      rotY: config.rotY || 0.008,
      orbitR: Math.sqrt(config.x * config.x + config.y * config.y),
      orbitAngle: Math.atan2(config.y, config.x),
      orbitSpeed: config.orbitSpeed || 0.001,
      moonMesh,
      moonOrbit
    });
  }

  // Planet 1: Saturn-like (Vành đai khí khổng lồ - Tím Ánh Bạc)
  createPlanet({
    x: -9.5, y: -4.5, z: 2.0,
    radius: 1.5,
    color: 0x5a4d8c,
    metalness: 0.6,
    roughness: 0.35,
    hasRing: true,
    ringInner: 2.0,
    ringOuter: 3.5,
    ringColor: 0xa899e6,
    ringOpacity: 0.8,
    hasMoon: true,
    moonRadius: 0.26,
    moonDist: 4.0,
    orbitSpeed: 0.0008
  });

  // Planet 2: Crimson Zebra Planet (Sao Hỏa / Hành tinh Đỏ Zebra)
  createPlanet({
    x: 8.5, y: -5.5, z: 4.5,
    radius: 1.25,
    color: 0xe31837,
    emissive: 0x550008,
    metalness: 0.5,
    roughness: 0.3,
    hasRing: false,
    hasMoon: true,
    moonRadius: 0.22,
    moonDist: 2.2,
    orbitSpeed: 0.0012
  });

  // Planet 3: Cyan Ice Giant (Hành tinh băng ngọc Uranus)
  createPlanet({
    x: -7.5, y: 7.2, z: -4.0,
    radius: 1.35,
    color: 0x00b4d8,
    emissive: 0x002233,
    metalness: 0.7,
    roughness: 0.2,
    hasRing: true,
    ringInner: 1.7,
    ringOuter: 2.3,
    ringColor: 0x90e0ef,
    ringOpacity: 0.6,
    orbitSpeed: 0.0006
  });

  // Planet 4: Golden Exoplanet (Hành tinh cát vàng sa mạc)
  createPlanet({
    x: 9.8, y: 8.5, z: -14.0,
    radius: 1.7,
    color: 0xf4a261,
    metalness: 0.4,
    roughness: 0.5,
    orbitSpeed: 0.0005
  });

  // Planet 5: Emerald Exo-world (Hành tinh ngọc lục bảo)
  createPlanet({
    x: -2.0, y: -10.5, z: 1.0,
    radius: 0.85,
    color: 0x2ec4b6,
    metalness: 0.8,
    roughness: 0.2,
    orbitSpeed: 0.0015
  });

  // --------------------------------------------------------------
  // 4. METEORS / SHOOTING STARS (Sao băng)
  // --------------------------------------------------------------
  const meteorCount = 2;
  const meteors = [];
  for (let m = 0; m < meteorCount; m++) {
    const mGeo = new THREE.BufferGeometry();
    const mPos = new Float32Array(6);
    mGeo.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
    const mMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const line = new THREE.Line(mGeo, mMat);
    scene.add(line);
    meteors.push({
      line,
      active: false,
      timer: 40 + Math.random() * 150,
      x: 0, y: 0, z: 0,
      vx: 0, vy: 0, vz: 0,
      life: 0
    });
  }

  function triggerMeteor(m) {
    m.active = true;
    m.life = 1.0;
    m.x = (Math.random() - 0.5) * 36;
    m.y = 12 + Math.random() * 8;
    m.z = (Math.random() - 0.5) * 18;
    m.vx = (Math.random() - 0.5) * 0.7 - 0.5;
    m.vy = -(0.8 + Math.random() * 0.5);
    m.vz = (Math.random() - 0.5) * 0.3;
  }

  // --------------------------------------------------------------
  // 5. PARALLAX & ANIMATION LOOP
  // --------------------------------------------------------------
  let tx = 0, ty = 0;
  document.addEventListener('mousemove', e => {
    tx = (e.clientX / window.innerWidth  - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });
  window.addEventListener('deviceorientation', e => {
    if (e.gamma != null) { tx = (e.gamma / 45) * 0.8; ty = (e.beta / 45) * 0.6; }
  });

  let t = 0;
  (function animate() {
    requestAnimationFrame(animate);
    t += 0.008;

    // Parallax
    camera.position.x += (tx * 3.5 - camera.position.x) * 0.04;
    camera.position.y += (-ty * 2.5 - camera.position.y) * 0.04;
    camera.lookAt(0, 0, 0);

    // Galaxy rotation
    galaxyGroup.rotation.y += 0.0009;

    // Black Hole accretion spin
    accretionRing1.rotation.z += 0.012;
    accretionRing2.rotation.z -= 0.008;
    blackHoleGroup.rotation.y = Math.sin(t * 0.3) * 0.15;

    // Swirling matter around black hole
    const bhPosArr = bhPGeo.attributes.position.array;
    for (let i = 0; i < bhParticleCount; i++) {
      const orb = bhOrbits[i];
      orb.angle += orb.speed;
      bhPosArr[i * 3]     = Math.cos(orb.angle) * orb.r;
      bhPosArr[i * 3 + 1] = orb.yOffset + Math.sin(orb.angle * 2) * 0.12;
      bhPosArr[i * 3 + 2] = Math.sin(orb.angle) * orb.r * 0.45;
    }
    bhPGeo.attributes.position.needsUpdate = true;

    // Planets orbit & self-rotation
    planets.forEach(p => {
      p.body.rotation.y += p.rotY;
      p.orbitAngle += p.orbitSpeed;
      p.group.position.x = Math.cos(p.orbitAngle) * p.orbitR;
      p.group.position.y = Math.sin(p.orbitAngle) * p.orbitR + Math.sin(t * 0.6 + p.orbitR) * 0.35;

      if (p.moonMesh && p.moonOrbit) {
        p.moonOrbit.angle += p.moonOrbit.speed;
        p.moonMesh.position.x = Math.cos(p.moonOrbit.angle) * p.moonOrbit.dist;
        p.moonMesh.position.z = Math.sin(p.moonOrbit.angle) * p.moonOrbit.dist;
      }
    });

    // Animate core light
    coreLight.position.x = blackHoleGroup.position.x + Math.sin(t * 1.5) * 1.5;
    coreLight.position.y = blackHoleGroup.position.y + Math.cos(t * 1.5) * 1.5;

    // Meteors
    meteors.forEach(m => {
      if (m.active) {
        m.x += m.vx; m.y += m.vy; m.z += m.vz;
        m.life -= 0.025;
        const pos = m.line.geometry.attributes.position.array;
        pos[0] = m.x; pos[1] = m.y; pos[2] = m.z;
        pos[3] = m.x - m.vx * 3.5; pos[4] = m.y - m.vy * 3.5; pos[5] = m.z - m.vz * 3.5;
        m.line.geometry.attributes.position.needsUpdate = true;
        m.line.material.opacity = Math.max(0, m.life);
        if (m.life <= 0) {
          m.active = false;
          m.timer = 120 + Math.random() * 240;
        }
      } else {
        m.timer--;
        if (m.timer <= 0) triggerMeteor(m);
      }
    });

    renderer.render(scene, camera);
  })();
})();

  cardEl.style.transform = `perspective(1000px) rotateY(${x*10}deg) rotateX(${-y*8}deg) translateZ(8px)`;
  cardEl.style.boxShadow = `${-x*20}px ${y*14}px 60px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.2)`;

});

function openQR() {

}

}
function copyText(e,text) {

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');

}
