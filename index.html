<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zebra Digital Card</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --zebra:   #1a1a1a;
  --accent:  #e31837;
  --accent2: #ff6b35;
  --text:    #0f0f0f;
  --muted:   #6b7280;
  --border:  rgba(255,255,255,0.18);
  --glass:   rgba(255,255,255,0.72);
  --glass2:  rgba(255,255,255,0.45);
  --shadow:  0 32px 80px rgba(0,0,0,0.22), 0 8px 24px rgba(0,0,0,0.12);
}

html, body {
  height: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #0a0a0f;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 36px 16px 60px;
  position: relative;
}

/* ===== 3D CANVAS BG ===== */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ===== CARD WRAPPER WITH TILT ===== */
.scene {
  width: 100%;
  max-width: 420px;
  perspective: 1200px;
  position: relative;
  z-index: 10;
}

.card {
  width: 100%;
  background: var(--glass);
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  border-radius: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  opacity: 0;
  transform: translateY(32px) rotateX(4deg);
  animation: cardRise 0.8s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
  transform-style: preserve-3d;
  transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
  will-change: transform;
}

@keyframes cardRise {
  to { opacity: 1; transform: translateY(0) rotateX(0deg); }
}

/* Gloss shimmer on card */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg,
    rgba(255,255,255,0.55) 0%,
    rgba(255,255,255,0.0) 50%,
    rgba(255,255,255,0.08) 100%
  );
  pointer-events: none;
  z-index: 1;
  border-radius: 24px;
}

/* ===== HEADER ===== */
.card-header {
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  position: relative;
  z-index: 2;
}

.zebra-logo-img { height: 26px; display: block; }

.zebra-logo-fallback {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: var(--zebra);
}

.nfc-badge {
  display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,0.06);
  border: 1px solid rgba(0,0,0,0.09);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: 9px; letter-spacing: 2px;
  color: #444;
  font-weight: 600; text-transform: uppercase;
  font-family: 'DM Mono', monospace;
}
.nfc-dot {
  width: 6px; height: 6px;
  background: var(--accent); border-radius: 50%;
  animation: blink 2s infinite;
  box-shadow: 0 0 6px var(--accent);
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.15;} }

/* ===== HERO BANNER ===== */
.card-hero {
  position: relative;
  height: 110px;
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 40%, #e31837 100%);
  overflow: hidden;
  z-index: 2;
}

.card-hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
}

.card-hero-glow {
  position: absolute;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(227,24,55,0.5) 0%, transparent 70%);
  right: -40px; top: -80px;
  animation: glowPulse 4s ease-in-out infinite alternate;
}

@keyframes glowPulse {
  from { transform: scale(1); opacity: 0.7; }
  to   { transform: scale(1.2); opacity: 1; }
}

.card-hero-label {
  position: absolute;
  bottom: 14px; left: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 3px;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
}

/* ===== AVATAR ===== */
.avatar-section {
  display: flex;
  justify-content: center;
  position: relative;
  z-index: 3;
}

.avatar-wrap {
  margin-top: -52px;
  display: flex; flex-direction: column; align-items: center;
}

.avatar {
  width: 96px; height: 96px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.9);
  background: linear-gradient(135deg, #333, #111);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px; color: white;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.1);
  overflow: hidden; cursor: pointer; position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
}

.avatar:hover {
  transform: scale(1.04);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 3px rgba(227,24,55,0.4);
}

.avatar-img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }

.avatar-overlay {
  position: absolute; inset: 0; border-radius: 50%;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; opacity: 0; transition: opacity 0.2s;
}
.avatar:hover .avatar-overlay { opacity: 1; }
.avatar-hint {
  font-size: 9px; color: var(--muted);
  margin-top: 6px; letter-spacing: 1.5px;
  font-family: 'DM Mono', monospace; text-transform: uppercase;
}
#avatarInput { display: none; }

/* ===== BODY ===== */
.card-body {
  padding: 20px 22px 26px;
  position: relative; z-index: 2;
}

.name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  text-align: center;
  color: var(--zebra);
  letter-spacing: 1.5px;
  line-height: 1;
  margin-top: 2px;
  text-shadow: 0 1px 0 rgba(255,255,255,0.8);
}

.title-line {
  text-align: center; margin-top: 5px;
  font-size: 10px; font-weight: 600;
  color: var(--accent);
  letter-spacing: 3px; text-transform: uppercase;
  font-family: 'DM Mono', monospace;
}

.company-line {
  text-align: center; margin-top: 3px;
  font-size: 12px; color: var(--muted); font-weight: 400;
}

/* Divider */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.08), transparent);
  margin: 18px 0;
}

/* ===== SECTION ===== */
.section { margin-top: 18px; }
.section-label {
  font-size: 9px; font-weight: 500;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px; padding-left: 2px;
  font-family: 'DM Mono', monospace;
}

/* ===== LINKS ===== */
.links { display: flex; flex-direction: column; gap: 7px; }

.link-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 13px;
  text-decoration: none; color: var(--text);
  transition: all 0.18s ease;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

.link-btn:hover {
  background: rgba(255,255,255,0.9);
  border-color: rgba(227,24,55,0.2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 0 0 1px rgba(227,24,55,0.12);
  transform: translateX(4px) translateY(-1px);
}

.link-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.link-label { font-size: 9px; color: var(--muted); font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; font-family: 'DM Mono', monospace; }
.link-value { font-size: 13px; font-weight: 500; margin-top: 1px; }
.link-text { text-align: left; line-height: 1.4; flex: 1; }
.link-arrow { color: #bbb; font-size: 20px; margin-left: auto; line-height: 1; }

/* ===== TAX BOX ===== */
.tax-box {
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(0,0,0,0.07);
  border-radius: 14px;
  overflow: hidden;
  backdrop-filter: blur(8px);
}

.tax-row {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 10px;
  padding: 10px 13px;
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.tax-row:last-child { border-bottom: none; }

.tax-key {
  font-size: 10px; color: var(--muted); font-weight: 500;
  letter-spacing: 0.5px; text-transform: uppercase;
  white-space: nowrap; padding-top: 2px;
  font-family: 'DM Mono', monospace;
  flex-shrink: 0; min-width: 90px;
}
.tax-val-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; flex: 1; }
.tax-val { font-size: 12px; font-weight: 500; color: var(--text); text-align: right; }
.tax-id-val {
  font-family: 'DM Mono', monospace;
  font-size: 15px; font-weight: 600; letter-spacing: 2px;
  color: var(--zebra);
}

.copy-btn {
  background: none;
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 6px; padding: 2px 8px;
  font-size: 10px; color: var(--muted); cursor: pointer;
  flex-shrink: 0; font-family: 'DM Mono', monospace;
  transition: all 0.15s; font-weight: 500;
  letter-spacing: 0.5px;
}
.copy-btn:hover { background: var(--zebra); color: white; border-color: var(--zebra); }

/* ===== ACTION BUTTONS ===== */
.btn-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-top: 18px;
}

.btn-half {
  padding: 13px 10px;
  border: none; border-radius: 13px;
  font-family: 'DM Mono', monospace;
  font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
  text-transform: uppercase; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: all 0.2s ease;
  position: relative; overflow: hidden;
}

.btn-save {
  background: linear-gradient(135deg, #1a1a1a, #333);
  color: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}

.btn-qr {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  box-shadow: 0 4px 16px rgba(227,24,55,0.3);
}
.btn-qr:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(227,24,55,0.45);
}

/* ===== FOOTER ===== */
.card-footer {
  text-align: center;
  padding: 12px 20px 16px;
  font-size: 9px; letter-spacing: 2px;
  color: rgba(0,0,0,0.25); text-transform: uppercase;
  font-family: 'DM Mono', monospace;
  border-top: 1px solid rgba(0,0,0,0.05);
  position: relative; z-index: 2;
}

/* ===== QR MODAL ===== */
.qr-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.qr-backdrop.open { opacity: 1; pointer-events: all; }

.qr-modal {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-radius: 22px;
  padding: 28px 24px;
  max-width: 300px; width: 90%;
  text-align: center;
  transform: translateY(20px) scale(0.96);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  border: 1px solid rgba(255,255,255,0.8);
  box-shadow: 0 32px 80px rgba(0,0,0,0.25);
}
.qr-backdrop.open .qr-modal { transform: translateY(0) scale(1); }

.qr-modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--zebra); }
.qr-modal-sub { font-size: 11px; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }
#qrContainer { display: flex; justify-content: center; }
#qrContainer img, #qrContainer canvas { border-radius: 10px; }
.qr-url { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 12px; word-break: break-all; }
.qr-close {
  margin-top: 16px;
  background: var(--zebra); color: white;
  border: none; border-radius: 10px;
  padding: 10px 28px; cursor: pointer;
  font-family: 'DM Mono', monospace;
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  transition: opacity 0.15s;
}
.qr-close:hover { opacity: 0.8; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 28px; left: 50%; z-index: 9999;
  transform: translateX(-50%) translateY(70px);
  background: rgba(26,26,26,0.92);
  backdrop-filter: blur(12px);
  color: white;
  padding: 10px 22px; border-radius: 30px;
  font-size: 12px; font-weight: 500; letter-spacing: 0.3px;
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.1);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 3D Background Canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Card -->
<div class="scene" id="scene">
  <div class="card" id="card"></div>
</div>

<div class="toast" id="toast"></div>

<!-- QR Modal -->
<div class="qr-backdrop" id="qrBackdrop" onclick="closeQR(event)">
  <div class="qr-modal">
    <div class="qr-modal-title">📲 Chia sẻ card</div>
    <div class="qr-modal-sub">Quét để mở profile hoặc lưu danh bạ</div>
    <div id="qrContainer"></div>
    <div class="qr-url" id="qrUrl"></div>
    <button class="qr-close" onclick="document.getElementById('qrBackdrop').classList.remove('open')">Đóng</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
// ================================================================
// 3D BACKGROUND
// ================================================================
(function() {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x07070d, 1);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x07070d, 0.022);

  const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 200);
  camera.position.set(0, 0, 30);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));
  const r1 = new THREE.PointLight(0xe31837, 5, 40);
  r1.position.set(8, 6, 4);
  scene.add(r1);
  const b1 = new THREE.PointLight(0x1a3aff, 3, 35);
  b1.position.set(-10, -4, 2);
  scene.add(b1);
  const w1 = new THREE.PointLight(0xffeedd, 2, 60);
  w1.position.set(0, 20, 10);
  scene.add(w1);

  // Floating spheres / icosahedra
  const objs = [];
  const mats = [
    new THREE.MeshStandardMaterial({ color: 0xe31837, metalness: 0.85, roughness: 0.12 }),
    new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.95, roughness: 0.05 }),
    new THREE.MeshStandardMaterial({ color: 0x2244cc, metalness: 0.8, roughness: 0.15, transparent: true, opacity: 0.7 }),
    new THREE.MeshStandardMaterial({ color: 0xffeedd, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.5 }),
  ];

  for (let i = 0; i < 22; i++) {
    const t = Math.random();
    const geo = t < 0.4
      ? new THREE.IcosahedronGeometry(0.3 + Math.random() * 0.7, 0)
      : t < 0.7
        ? new THREE.OctahedronGeometry(0.25 + Math.random() * 0.6, 0)
        : new THREE.TetrahedronGeometry(0.3 + Math.random() * 0.5, 0);
    const mat = mats[Math.floor(Math.random() * mats.length)];
    const mesh = new THREE.Mesh(geo, mat);

    const r = 12 + Math.random() * 14;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    mesh.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi)
    );
    mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    scene.add(mesh);
    objs.push({
      mesh,
      rx: (Math.random()-0.5)*0.012,
      ry: (Math.random()-0.5)*0.015,
      ot: Math.random()*Math.PI*2,
      os: (Math.random()-0.5)*0.002,
      or: r, ophiSin: Math.sin(phi), ophiCos: Math.cos(phi), oTheta: theta,
      fy: Math.random()*Math.PI*2,
    });
  }

  // Particle field
  const N = 2000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 18 + Math.random() * 30;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(ph);
    const c = Math.random();
    if (c < 0.35) { col[i*3]=0.9; col[i*3+1]=0.09; col[i*3+2]=0.2; }
    else if (c < 0.6) { col[i*3]=0.1; col[i*3+1]=0.25; col[i*3+2]=1; }
    else { col[i*3]=1; col[i*3+1]=0.95; col[i*3+2]=0.9; }
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pMat = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.65, sizeAttenuation: true });
  const pts = new THREE.Points(pGeo, pMat);
  scene.add(pts);

  // Mouse parallax
  let mx = 0, my = 0;
  document.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.008;

    camera.position.x += (mx * 3 - camera.position.x) * 0.03;
    camera.position.y += (-my * 2 - camera.position.y) * 0.03;
    camera.lookAt(scene.position);

    r1.position.x = Math.sin(t * 0.7) * 12;
    r1.position.z = Math.cos(t * 0.5) * 8;
    b1.position.x = Math.cos(t * 0.4) * 10;
    b1.position.y = Math.sin(t * 0.6) * 7;

    objs.forEach(o => {
      o.oTheta += o.os;
      o.mesh.position.x = o.or * o.ophiSin * Math.cos(o.oTheta);
      o.mesh.position.y = o.or * o.ophiSin * Math.sin(o.oTheta) + Math.sin(t*0.6 + o.fy)*1.2;
      o.mesh.rotation.x += o.rx;
      o.mesh.rotation.y += o.ry;
    });

    pts.rotation.y += 0.0003;
    renderer.render(scene, camera);
  }
  animate();
})();

// ================================================================
// CARD TILT
// ================================================================
const scene3d = document.getElementById('scene');
const cardEl  = document.getElementById('card');

scene3d.addEventListener('mousemove', e => {
  const rect = scene3d.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width - 0.5;
  const y = (e.clientY - rect.top)  / rect.height - 0.5;
  cardEl.style.transform = `perspective(1200px) rotateY(${x * 10}deg) rotateX(${-y * 8}deg) translateZ(6px)`;
  cardEl.style.boxShadow = `
    ${-x*18}px ${y*12}px 60px rgba(0,0,0,0.28),
    0 8px 24px rgba(0,0,0,0.14),
    ${x*4}px ${-y*4}px 0 rgba(255,255,255,0.06) inset
  `;
});

scene3d.addEventListener('mouseleave', () => {
  cardEl.style.transform = '';
  cardEl.style.boxShadow = '';
});

// ================================================================
// PROFILES
// ================================================================
const profiles = {
  "phu": {
    name: "Lữ Thành Phú",
    title: "Sales Engineer",
    company: "Zebra Technologies (Vietnam) Ltd.",
    avatarUrl: "avatars/phu.jpg",
    initials: "PL",

const params = new URLSearchParams(window.location.search);
const id = params.get('id') || 'phu';
const p  = profiles[id];

let avatarSrc = p ? (p.avatarUrl || null) : null;

function avatarHTML() {
  const inner = avatarSrc
    ? `<img class="avatar-img" src="${avatarSrc}" alt="avatar" onerror="this.style.display='none';this.parentNode.querySelector('.avatar-init').style.display='flex'">`
    : '';
  return `
    <div class="avatar" id="avatarCircle" onclick="document.getElementById('avatarInput').click()">
      ${inner}
      <span class="avatar-init" style="${avatarSrc ? 'display:none' : ''}">${p.initials}</span>
      <div class="avatar-overlay">📷</div>
    </div>
    <input type="file" id="avatarInput" accept="image/*">
    <div class="avatar-hint">Nhấn để thay ảnh</div>
  `;
}

if (!p) {
  cardEl.innerHTML = `<div style="padding:48px 24px;text-align:center;color:#aaa;font-family:sans-serif">Profile không tồn tại.</div>`;
} else {
  document.title = p.name + " · Zebra";

  const linksHTML = p.links.map(l => `
    <a class="link-btn" href="${l.action}" ${l.action.startsWith('http') ? 'target="_blank"' : ''}>
      <div class="link-icon" style="background:${l.bg}">${l.icon}</div>
      <div class="link-text">
        <div class="link-label">${l.label}</div>
        <div class="link-value">${l.value}</div>
      </div>
      <span class="link-arrow">›</span>
    </a>
  `).join('');

  const t = p.tax;
  const taxRowsData = [
    { key:"Tên công ty", val:t.companyName, cls:"",           copy:true  },
    { key:"Mã số thuế",  val:t.taxId,       cls:"tax-id-val", copy:true  },
    { key:"Địa chỉ",     val:t.address,     cls:"",           copy:false },
    { key:"Đại diện",    val:t.representative, cls:"",        copy:false },
  ];

  const taxHTML = taxRowsData.map(r => `
    <div class="tax-row">
      <span class="tax-key">${r.key}</span>
      <div class="tax-val-wrap">
        <span class="tax-val ${r.cls}">${r.val}</span>
        ${r.copy ? `<button class="copy-btn" onclick="copyText(event,'${r.val}')">Copy</button>` : ''}
      </div>
    </div>
  `).join('');

  cardEl.innerHTML = `
    <div class="card-header">
      <img class="zebra-logo-img" src="zebra-logo.png" alt="Zebra Technologies"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="zebra-logo-fallback" style="display:none">ZEBRA</div>
      <div class="nfc-badge"><div class="nfc-dot"></div>NFC Card</div>
    </div>

    <div class="card-hero">
      <div class="card-hero-grid"></div>
      <div class="card-hero-glow"></div>
      <div class="card-hero-label">Zebra Technologies · Digital Profile</div>
    </div>

    <div class="avatar-section">
      <div class="avatar-wrap" id="avatarWrap">${avatarHTML()}</div>
    </div>

    <div class="card-body">
      <div class="name">${p.name}</div>
      <div class="title-line">${p.title}</div>
      <div class="company-line">${p.company}</div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-label">Liên hệ</div>
        <div class="links">${linksHTML}</div>
      </div>

      <div class="section">
        <div class="section-label">Thông tin công ty · Hoá đơn VAT</div>
        <div class="tax-box">${taxHTML}</div>
      </div>

      <div class="btn-row">
        <button class="btn-half btn-save" onclick="saveContact()">💾 Lưu danh bạ</button>
        <button class="btn-half btn-qr" onclick="openQR()">📲 Chia sẻ QR</button>
      </div>
    </div>

    <div class="card-footer">Zebra Technologies · Digital Business Card</div>
  `;

  function attachAvatarListener() {
    const inp = document.getElementById('avatarInput');
    if (!inp) return;
    inp.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        avatarSrc = ev.target.result;
        document.getElementById('avatarWrap').innerHTML = avatarHTML();
        attachAvatarListener();
      };
      reader.readAsDataURL(file);
    });
  }
  attachAvatarListener();
}

// ================================================================
function openQR() {
  const profileUrl = `https://phu-lu.github.io/card/?id=${id}`;
  const container = document.getElementById('qrContainer');
  container.innerHTML = '';
  new QRCode(container, {
    text: profileUrl,
    width: 210, height: 210,
    colorDark: '#1a1a1a', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById('qrUrl').textContent = profileUrl;
  document.getElementById('qrBackdrop').classList.add('open');
}

function closeQR(e) {
  if (e.target === document.getElementById('qrBackdrop'))
    document.getElementById('qrBackdrop').classList.remove('open');
}

function saveContact() {
  const v = p.vcard;
  const vcf = `BEGIN:VCARD\nVERSION:3.0\nFN:${v.fn}\nORG:${v.org}\nTITLE:${v.title}\nTEL;TYPE=CELL:${v.phone}\nEMAIL:${v.email}\nEND:VCARD`;
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([vcf], {type:'text/vcard'})),
    download: `${id}.vcf`
  });
  a.click();
  showToast('📱 Đang tải file danh bạ...');
}

function copyText(e, text) {
  e.preventDefault();
  navigator.clipboard.writeText(text).then(() => showToast('✓ Đã sao chép'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
